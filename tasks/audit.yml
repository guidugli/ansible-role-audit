---

- name: Gather installed packages on Debian-family systems
  ansible.builtin.package_facts:
    manager: apt
  when: ansible_facts.get('os_family', '') == 'Debian'
  tags:
    - audit
    - install

- name: Refresh apt cache when audit packages are missing
  ansible.builtin.apt:
    update_cache: true
  when:
    - ansible_facts.get('os_family', '') == 'Debian'
    - >-
      audit_packages
      | difference(ansible_facts['packages'].keys() | list)
      | length > 0
  tags:
    - audit
    - install

- name: Install audit packages
  ansible.builtin.package:
    name: '{{ audit_packages }}'
    state: present

  tags:
    - audit
    - install

- name: Enable and start auditd service on non-container targets
  ansible.builtin.systemd_service:
    name: auditd
    masked: false
    enabled: true
    state: started
  when:
    - ansible_facts['service_mgr'] == 'systemd'
    - ansible_facts.get('virtualization_type', '') not in _container_types
    - ansible_connection not in _container_types
  tags:
    - audit
    - service

- name: Check whether GRUB contains audit=1
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^\s*GRUB_CMDLINE_LINUX.*audit=1'
    state: absent
  check_mode: true
  changed_when: false
  register: audit_cmdline_audit1
  when:
    - not audit_skip_grub_check
    - ansible_facts.get('virtualization_type', '') not in _container_types
    - ansible_connection not in _container_types

  tags:
    - audit
    - validate

- name: Fail when GRUB does not contain audit=1
  ansible.builtin.fail:
    msg: >-
      GRUB kernel parameters do not contain audit=1. Manage bootloader settings
      in a separate GRUB role or host baseline.
  when:
    - not audit_skip_grub_check
    - ansible_facts.get('virtualization_type', '') not in _container_types
    - ansible_connection not in _container_types
    - not audit_cmdline_audit1.found

  tags:
    - audit
    - validate

- name: Check whether GRUB contains audit_backlog_limit
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^\s*GRUB_CMDLINE_LINUX.*audit_backlog_limit=.+'
    state: absent
  check_mode: true
  changed_when: false
  register: audit_cmdline_backlog
  when:
    - not audit_skip_grub_check
    - ansible_facts.get('virtualization_type', '') not in _container_types
    - ansible_connection not in _container_types

  tags:
    - audit
    - validate

- name: Fail when GRUB does not contain audit_backlog_limit
  ansible.builtin.fail:
    msg: >-
      GRUB kernel parameters do not contain audit_backlog_limit. Manage
      bootloader settings in a separate GRUB role or host baseline.
  when:
    - not audit_skip_grub_check
    - ansible_facts.get('virtualization_type', '') not in _container_types
    - ansible_connection not in _container_types
    - not audit_cmdline_backlog.found

  tags:
    - audit
    - validate

- name: Read UID_MIN from /etc/login.defs
  ansible.builtin.command:
    argv:
      - awk
      - '/^UID_MIN[[:space:]]+/ { print $2; exit }'
      - /etc/login.defs
  register: audit_uid_min_cmd
  changed_when: false

  tags:
    - audit
    - config

- name: Validate minimum audited UID
  ansible.builtin.assert:
    quiet: true
    that:
      - audit_uid_min_cmd.stdout | trim is match('^[0-9]+$')
    fail_msg: >-
      Unable to determine a numeric UID_MIN from /etc/login.defs.
  tags:
    - audit
    - validate

- name: Set audit rendering facts
  ansible.builtin.set_fact:
    audit_uid_min: '{{ audit_uid_min_cmd.stdout | trim }}'
    _audit_rule_architectures: >-
      {{
        ['b64', 'b32']
        if ansible_facts['architecture'] == 'x86_64'
        else ['b64']
      }}
  changed_when: false
  tags:
    - audit
    - config

- name: Apply boolean auditd.conf settings
  ansible.builtin.lineinfile:
    path: '{{ audit_config_path }}'
    regexp: '^{{ _audit_vars[item] }}\s*=.*$'
    line: >-
      {{ _audit_vars[item] }} =
      {{ (lookup('vars', item) | bool) | ternary('yes', 'no') }}
    mode: "{{ _audit_config_effective_mode }}"
  loop: '{{ _audit_bool_vars }}'
  notify: reload auditd
  tags:
    - audit
    - config

- name: Apply scalar auditd.conf settings
  ansible.builtin.lineinfile:
    path: '{{ audit_config_path }}'
    regexp: '^{{ _audit_vars[item] }}\s*=.*$'
    line: >-
      {{ _audit_vars[item] }} =
      {{
        ((lookup('vars', item) | string) | lower)
        if item in _audit_lowercase_option_vars
        else (lookup('vars', item) | string)
      }}
    mode: "{{ _audit_config_effective_mode }}"
  loop: '{{ _audit_config_items }}'
  when:
    - item not in _audit_optional_string_vars or (lookup('vars', item) | string | trim | length > 0)
  notify: reload auditd

  tags:
    - audit
    - config

- name: Find privileged commands
  ansible.builtin.command:
    argv:
      - find
      - /
      - -xdev
      - '('
      - -perm
      - -4000
      - -o
      - -perm
      - -2000
      - ')'
      - -type
      - f
      - -print
  register: audit_privileged_commands_cmd
  changed_when: false
  when: "'55-privileged.rules' in audit_rules_files"

  tags:
    - audit
    - config

- name: Set privileged command list
  ansible.builtin.set_fact:
    audit_priv_command: >-
      {{ audit_privileged_commands_cmd.stdout_lines | default([]) | sort }}
  changed_when: false
  when: "'55-privileged.rules' in audit_rules_files"
  tags:
    - audit
    - config

- name: Deploy selected audit rule templates
  ansible.builtin.template:
    src: '{{ item }}'
    dest: '{{ audit_rulesd_path }}/{{ item }}'
    owner: "{{ audit_config_file_owner }}"
    group: "{{ audit_config_file_group }}"
    mode: "{{ _audit_rule_effective_mode }}"
    force: '{{ force_overwrite_audit }}'
  loop: '{{ audit_rules_files }}'
  notify: reload auditd

  tags:
    - audit
    - config

- name: Configure immutable audit finalization
  ansible.builtin.copy:
    dest: '{{ audit_rulesd_path }}/99-finalize.rules'
    content: |
      -e 2
    owner: "{{ audit_config_file_owner }}"
    group: "{{ audit_config_file_group }}"
    mode: "{{ _audit_rule_effective_mode }}"
  when: audit_immutable
  notify: reload auditd
  tags:
    - audit
    - config

- name: Remove immutable audit finalization when disabled
  ansible.builtin.file:
    path: '{{ audit_rulesd_path }}/99-finalize.rules'
    state: absent
  when: not audit_immutable
  notify: reload auditd
  tags:
    - audit
    - config
