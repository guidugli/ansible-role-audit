---

- name: Verify audit role
  hosts: all
  gather_facts: true
  vars_files:
    - ../../defaults/main.yml
  vars:
    audit_manage_file_access: true
  tasks:
    - name: Locate auditctl binary
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - command -v auditctl
      register: auditctl_path
      changed_when: false
      failed_when: false

      tags:
        - audit
        - validate

    - name: Assert auditctl binary is installed
      ansible.builtin.assert:
        quiet: true
        that:
          - auditctl_path.rc == 0
          - auditctl_path.stdout | trim | length > 0
        fail_msg: auditctl binary is not available.

      tags:
        - audit
        - validate

    - name: Stat auditd configuration file
      ansible.builtin.stat:
        path: /etc/audit/auditd.conf
      register: auditd_conf_stat

      tags:
        - audit
        - validate

    - name: Assert auditd configuration file exists
      ansible.builtin.assert:
        quiet: true
        that:
          - auditd_conf_stat.stat.exists
          - auditd_conf_stat.stat.pw_name == 'root'
          - auditd_conf_stat.stat.gr_name == 'root'
        fail_msg: /etc/audit/auditd.conf must exist and be owned by root.

      tags:
        - audit
        - validate

    - name: Stat audit rules directory
      ansible.builtin.stat:
        path: /etc/audit/rules.d
      register: audit_rulesd_stat

      tags:
        - audit
        - validate

    - name: Assert audit rules directory exists
      ansible.builtin.assert:
        quiet: true
        that:
          - audit_rulesd_stat.stat.exists
          - audit_rulesd_stat.stat.isdir
        fail_msg: /etc/audit/rules.d must exist.

      tags:
        - audit
        - validate

    - name: Stat immutable finalize rule
      ansible.builtin.stat:
        path: /etc/audit/rules.d/99-finalize.rules
      register: audit_finalize_rule_stat
      when: audit_immutable

      tags:
        - audit
        - validate

    - name: Assert immutable finalize rule exists with secure mode
      ansible.builtin.assert:
        quiet: true
        that:
          - audit_finalize_rule_stat.stat.exists
          - audit_finalize_rule_stat.stat.pw_name == audit_config_file_owner
          - audit_finalize_rule_stat.stat.gr_name == audit_config_file_group
          - >-
            audit_finalize_rule_stat.stat.mode
            == audit_config_file_mode
        fail_msg: >-
          /etc/audit/rules.d/99-finalize.rules must exist with owner
          {{ audit_config_file_owner }}:{{ audit_config_file_group }}
          and mode {{ audit_config_file_mode }}. Actual values were
          {{ audit_finalize_rule_stat.stat.pw_name | default('unknown') }}:
          {{ audit_finalize_rule_stat.stat.gr_name | default('unknown') }}
          with mode
          {{ audit_finalize_rule_stat.stat.mode | default('unknown') }}.
      when: audit_immutable
      tags:
        - audit
        - validate

    - name: Verify finalize rule content
      ansible.builtin.command:
        argv:
          - grep
          - -Fx
          - --
          - -e 2
          - /etc/audit/rules.d/99-finalize.rules
      register: audit_finalize_rule_content
      changed_when: false
      when: audit_immutable

      tags:
        - audit
        - validate

    - name: Assert finalize rule content is correct
      ansible.builtin.assert:
        quiet: true
        that:
          - audit_finalize_rule_content.rc == 0
        fail_msg: /etc/audit/rules.d/99-finalize.rules must contain -e 2.
      when: audit_immutable

      tags:
        - audit
        - validate

    - name: Stat selected deployed rule files
      ansible.builtin.stat:
        path: '/etc/audit/rules.d/{{ item }}'
      loop: "{{ audit_rules_files | default([]) }}"
      register: audit_rule_file_stats
      when: (audit_rules_files | default([]) | length) > 0

      tags:
        - audit
        - validate

    - name: Assert selected audit rule files exist with secure access
      ansible.builtin.assert:
        quiet: true
        that:
          - audit_rule_file_stat.stat.exists
          - audit_rule_file_stat.stat.isreg
          - audit_rule_file_stat.stat.pw_name == audit_config_file_owner
          - audit_rule_file_stat.stat.gr_name == audit_config_file_group
          - not audit_rule_file_stat.stat.xusr
          - not audit_rule_file_stat.stat.wgrp
          - not audit_rule_file_stat.stat.xgrp
          - not audit_rule_file_stat.stat.roth
          - not audit_rule_file_stat.stat.woth
          - not audit_rule_file_stat.stat.xoth
        fail_msg: >-
          Audit rule file {{ audit_rule_file_stat.item }} must exist with owner
          {{ audit_config_file_owner }}:{{ audit_config_file_group }} and mode
          {{ audit_config_file_mode }} or more restrictive. Actual ownership is
          {{ audit_rule_file_stat.stat.pw_name | default('unknown') }}:
          {{ audit_rule_file_stat.stat.gr_name | default('unknown') }} with mode
          {{ audit_rule_file_stat.stat.mode | default('unknown') }}.
      loop: "{{ audit_rule_file_stats.results | default([]) }}"
      loop_control:
        loop_var: audit_rule_file_stat
        label: "{{ audit_rule_file_stat.item }}"
      when: audit_rules_files | default([]) | length > 0
      tags:
        - audit
        - validate

    - name: Validate audit rules syntax
      ansible.builtin.command:
        argv:
          - augenrules
          - --check
      register: audit_rules_check
      changed_when: false
      failed_when: audit_rules_check.rc != 0

      tags:
        - audit
        - validate

    - name: Check auditd service state on non-container systemd targets
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - auditd
      register: auditd_active
      changed_when: false
      failed_when: false
      when:
        - ansible_facts['service_mgr'] | default('') == 'systemd'
        - ansible_facts['virtualization_type'] | default('') not in ['docker', 'podman', 'lxc', 'containerd',
          'container']

      tags:
        - audit
        - validate

    - name: Assert auditd service is active on non-container systemd targets
      ansible.builtin.assert:
        quiet: true
        that:
          - auditd_active.rc == 0
          - (auditd_active.stdout | trim) == 'active'
        fail_msg: auditd should be active on non-container systemd targets.

      when:
        - auditd_active is defined
        - not (auditd_active.skipped | default(false) | bool)
      tags:
        - audit
        - validate

    - name: Read the configured audit log path for verification
      ansible.builtin.command:
        argv:
          - awk
          - -F=
          - >-
            /^[[:space:]]*log_file[[:space:]]*=/ {
              value = $2;
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", value);
              print value;
              exit
            }
          - /etc/audit/auditd.conf
      register: audit_verify_log_file_result
      changed_when: false
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Assert the configured audit log path is valid
      ansible.builtin.assert:
        that:
          - audit_verify_log_file_result.stdout | length > 0
          - audit_verify_log_file_result.stdout is match('^/')
        fail_msg: >-
          The audit log path could not be determined from
          /etc/audit/auditd.conf or is not absolute.
        quiet: true
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Set audit log paths for verification
      ansible.builtin.set_fact:
        audit_verify_log_file: "{{ audit_verify_log_file_result.stdout }}"
        audit_verify_log_directory: >-
          {{ audit_verify_log_file_result.stdout | dirname }}
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Inspect the audit log directory
      ansible.builtin.stat:
        path: "{{ audit_verify_log_directory }}"
      register: audit_verify_log_directory_stat
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Assert audit log directory access
      ansible.builtin.assert:
        that:
          - audit_verify_log_directory_stat.stat.exists
          - audit_verify_log_directory_stat.stat.isdir
          - audit_verify_log_directory_stat.stat.pw_name == audit_log_file_owner
          - audit_verify_log_directory_stat.stat.gr_name == audit_log_file_group
          - not audit_verify_log_directory_stat.stat.wgrp
          - not audit_verify_log_directory_stat.stat.roth
          - not audit_verify_log_directory_stat.stat.woth
          - not audit_verify_log_directory_stat.stat.xoth
        fail_msg: >-
          Audit log directory access is not aligned:
          {{ audit_verify_log_directory }}. Expected owner
          {{ audit_log_file_owner }}:{{ audit_log_file_group }} and mode
          {{ audit_log_directory_mode }} or more restrictive. Actual ownership is
          {{ audit_verify_log_directory_stat.stat.pw_name | default('unknown') }}:
          {{ audit_verify_log_directory_stat.stat.gr_name | default('unknown') }}
          with mode
          {{ audit_verify_log_directory_stat.stat.mode | default('unknown') }}.
        quiet: true
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Find existing audit log files for verification
      ansible.builtin.find:
        paths:
          - "{{ audit_verify_log_directory }}"
        file_type: file
        recurse: false
      register: audit_verify_log_files
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Assert audit log file access
      ansible.builtin.assert:
        that:
          - audit_verify_log_file.pw_name == audit_log_file_owner
          - audit_verify_log_file.gr_name == audit_log_file_group
          - not audit_verify_log_file.xusr
          - not audit_verify_log_file.wgrp
          - not audit_verify_log_file.xgrp
          - not audit_verify_log_file.roth
          - not audit_verify_log_file.woth
          - not audit_verify_log_file.xoth
        fail_msg: >-
          Audit log file access is not aligned:
          {{ audit_verify_log_file.path }}. Expected owner
          {{ audit_log_file_owner }}:{{ audit_log_file_group }} and mode
          {{ audit_log_file_mode }} or more restrictive. Actual ownership is
          {{ audit_verify_log_file.pw_name | default('unknown') }}:
          {{ audit_verify_log_file.gr_name | default('unknown') }} with mode
          {{ audit_verify_log_file.mode | default('unknown') }}.
        quiet: true
      loop: "{{ audit_verify_log_files.files }}"
      loop_control:
        loop_var: audit_verify_log_file
        label: "{{ audit_verify_log_file.path }}"
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Find deployed audit configuration files
      ansible.builtin.find:
        paths:
          - /etc/audit
        patterns:
          - "*.conf"
          - "*.rules"
        file_type: file
        recurse: true
      register: audit_verify_configuration_files
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Assert audit configuration file access
      ansible.builtin.assert:
        that:
          - audit_verify_configuration_file.pw_name == audit_config_file_owner
          - audit_verify_configuration_file.gr_name == audit_config_file_group
          - not audit_verify_configuration_file.xusr
          - not audit_verify_configuration_file.wgrp
          - not audit_verify_configuration_file.xgrp
          - not audit_verify_configuration_file.roth
          - not audit_verify_configuration_file.woth
          - not audit_verify_configuration_file.xoth
        fail_msg: >-
          Audit configuration file access is not aligned:
          {{ audit_verify_configuration_file.path }}. Expected owner
          {{ audit_config_file_owner }}:{{ audit_config_file_group }} and mode
          {{ audit_config_file_mode }} or more restrictive. Actual ownership is
          {{ audit_verify_configuration_file.pw_name | default('unknown') }}:
          {{ audit_verify_configuration_file.gr_name | default('unknown') }}
          with mode
          {{ audit_verify_configuration_file.mode | default('unknown') }}.
        quiet: true
      loop: "{{ audit_verify_configuration_files.files }}"
      loop_control:
        loop_var: audit_verify_configuration_file
        label: "{{ audit_verify_configuration_file.path }}"
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Inspect audit tools for verification
      ansible.builtin.stat:
        path: "{{ audit_verify_tool }}"
        follow: true
      loop: "{{ audit_tools }}"
      loop_control:
        loop_var: audit_verify_tool
        label: "{{ audit_verify_tool }}"
      register: audit_verify_tool_stats
      when: audit_manage_file_access
      tags:
        - audit
        - validate

    - name: Assert audit tool access
      ansible.builtin.assert:
        that:
          - audit_verify_tool_stat.stat.pw_name == audit_tool_owner
          - audit_verify_tool_stat.stat.gr_name == audit_tool_group
          - not audit_verify_tool_stat.stat.wgrp
          - not audit_verify_tool_stat.stat.woth
        fail_msg: >-
          Audit tool access is not aligned:
          {{ audit_verify_tool_stat.audit_verify_tool }}. Expected owner
          {{ audit_tool_owner }}:{{ audit_tool_group }} and mode
          {{ audit_tool_mode }} or more restrictive. Actual ownership is
          {{ audit_verify_tool_stat.stat.pw_name | default('unknown') }}:
          {{ audit_verify_tool_stat.stat.gr_name | default('unknown') }} with mode
          {{ audit_verify_tool_stat.stat.mode | default('unknown') }}.
        quiet: true
      loop: "{{ audit_verify_tool_stats.results }}"
      loop_control:
        loop_var: audit_verify_tool_stat
        label: >-
          {{
            audit_verify_tool_stat.audit_verify_tool
            | default('unknown audit tool')
          }}
      when:
        - audit_manage_file_access
        - audit_verify_tool_stat.stat is defined
        - audit_verify_tool_stat.stat.exists | default(false)
      tags:
        - audit
        - validate

    - name: Read selected platform-aware rule files
      ansible.builtin.slurp:
        src: '/etc/audit/rules.d/{{ item }}'
      loop:
        - 50-network.rules
        - 70-mac-policy.rules
      register: audit_platform_rule_files
      when: item in audit_rules_files
      tags:
        - audit
        - validate

    - name: Set rendered platform rule content
      ansible.builtin.set_fact:
        audit_network_rule_content: >-
          {{
            (
              audit_platform_rule_files.results
              | selectattr('item', 'equalto', '50-network.rules')
              | map(attribute='content')
              | first
              | default('')
            )
            | b64decode
          }}
        audit_mac_rule_content: >-
          {{
            (
              audit_platform_rule_files.results
              | selectattr('item', 'equalto', '70-mac-policy.rules')
              | map(attribute='content')
              | first
              | default('')
            )
            | b64decode
          }}
      changed_when: false
      tags:
        - audit
        - validate

    - name: Assert Debian-family rule rendering
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            '-F dir=/etc/network -F perm=wa'
            in audit_network_rule_content
          - >-
            '-F path=/etc/sysconfig/network -F perm=wa'
            not in audit_network_rule_content
          - "'/etc/apparmor' in audit_mac_rule_content"
          - "'/etc/selinux' not in audit_mac_rule_content"
      when: ansible_facts['os_family'] == 'Debian'
      tags:
        - audit
        - validate

    - name: Assert Fedora rule rendering
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            '-F path=/etc/sysconfig/network -F perm=wa'
            in audit_network_rule_content
          - >-
            '-F dir=/etc/network -F perm=wa'
            not in audit_network_rule_content
          - "'/etc/selinux' in audit_mac_rule_content"
          - "'/etc/apparmor' not in audit_mac_rule_content"
      when: ansible_facts['distribution'] == 'Fedora'
      tags:
        - audit
        - validate

    - name: Check modern syntax in selected baseline rules
      ansible.builtin.command:
        argv:
          - grep
          - -R
          - -n
          - --
          - '^-w '
          - '/etc/audit/rules.d/{{ item }}'
      loop:
        - 40-identity.rules
        - 40-login.rules
        - 50-network.rules
        - 50-sudoers.rules
        - 60-pam.rules
        - 70-mac-policy.rules
        - 70-sessions.rules
      register: audit_legacy_watch_checks
      changed_when: false
      failed_when: audit_legacy_watch_checks.rc not in [0, 1]
      when: item in audit_rules_files
      tags:
        - audit
        - validate

    - name: Assert selected baseline rules do not use legacy watch syntax
      ansible.builtin.assert:
        quiet: true
        that:
          - item.rc == 1
        fail_msg: >-
          {{ item.item }} contains active legacy -w syntax.
      loop: "{{ audit_legacy_watch_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.skipped | default(false)
      tags:
        - audit
        - validate
