---
# Core behavior
# Callers should set become: true at the play level when privilege escalation is required.
audit_local_events: true
audit_skip_grub_check: false
audit_write_logs: true

# auditd.conf settings
audit_log_file: ''
audit_log_format: enriched
audit_log_group: ''
audit_priority_boost: 4
audit_flush: incremental_async
audit_freq: 50
audit_num_logs: 5
audit_name_format: none
audit_name: ''
audit_max_log_file: 256
audit_max_log_file_action: keep_logs
audit_verify_email: true
audit_action_mail_acct: ''
audit_space_left: 75
audit_space_left_action: email
audit_admin_space_left: 50
audit_admin_space_left_action: suspend
audit_disk_full_action: suspend
audit_disk_error_action: suspend

# Remote audit transport
audit_tcp_listen_port: 60
audit_tcp_listen_queue: 5
audit_tcp_max_per_addr: 1
audit_use_libwrap: true
audit_tcp_client_ports: '1024-65535'
audit_tcp_client_max_idle: 0
audit_transport: tcp
audit_krb5_principal: ''
audit_krb5_key_file: ''
audit_distribute_network: false
audit_q_depth: 400
audit_overflow_action: syslog
audit_max_restarts: 10
audit_plugin_dir: /etc/audit/plugins.d

# Rule deployment
force_overwrite_audit: true
audit_sudo_log: /var/log/sudo.log
audit_rules_files:
  - 40-identity.rules
  - 40-login.rules
  - 50-network.rules
  - 50-sudoers.rules
  - 55-privileged.rules
  - 60-pam.rules
  - 70-mac-policy.rules
  - 70-sessions.rules

# CIS audit file-access controls
audit_manage_file_access: false

audit_log_directory_mode: '0750'
audit_log_file_mode: '0640'
audit_log_file_owner: root

# CIS accepts root or adm for audit log files.
# Use root for the conservative cross-platform default.
audit_log_file_group: root

audit_config_file_mode: '0640'
audit_config_file_owner: root
audit_config_file_group: root

audit_tool_owner: root
audit_tool_group: root
audit_tool_mode: '0755'

audit_tools:
  - /sbin/auditctl
  - /sbin/aureport
  - /sbin/ausearch
  - /sbin/autrace
  - /sbin/auditd
  - /sbin/augenrules
